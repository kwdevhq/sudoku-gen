name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet format src/SudokuGen.slnx --verify-no-changes
      - run: dotnet build src/SudokuGen.slnx -c Release
      - run: pwsh scripts/check-coverage.ps1 -Configuration Release -NoBuild -TestArgs --output,Detailed,--diagnostic,--diagnostic-verbosity,Trace
