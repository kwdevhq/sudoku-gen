name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet format SudokuGen.slnx --verify-no-changes
      - run: dotnet build SudokuGen.slnx -c Release
      - run: dotnet test --solution SudokuGen.slnx -c Release --no-build --coverage --coverage-output-format cobertura
      - run: pwsh scripts/check-coverage.ps1
