name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet format src/SudokuGen.slnx --verify-no-changes
      - run: dotnet build src/SudokuGen.slnx -c Release
      - run: dotnet test --solution src/SudokuGen.slnx -c Release --no-build; echo A=$?
        continue-on-error: true
      - run: dotnet test --solution src/SudokuGen.slnx -c Release --no-build --coverage --coverage-output-format cobertura; echo B=$?
        continue-on-error: true
      - run: pwsh -c 'dotnet test --solution src/SudokuGen.slnx -c Release --no-build; echo C=$LASTEXITCODE'
        continue-on-error: true
      - run: pwsh scripts/check-coverage.ps1 -Configuration Release -NoBuild
