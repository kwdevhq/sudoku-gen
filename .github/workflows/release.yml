name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_FROM_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Read version from tag
        shell: pwsh
        run: |
          $version = $env:VERSION_FROM_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$env:VERSION_FROM_TAG' is not vX.Y.Z." }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Check (format, build, coverage)
        shell: pwsh
        run: scripts/check.ps1
      - name: Pack library
        run: dotnet pack src/core/SudokuGen.csproj -c Release -p:Version=$VERSION -o artifacts/nuget
      - name: Publish TUI (win-x64)
        run: >
          dotnet publish src/samples/SudokuGen.Tui/SudokuGen.Tui.csproj
          -c Release -f net10.0 -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:Version=$VERSION -o artifacts/tui
      - name: Package TUI and write checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $zip = 'artifacts/release/sudoku-tui-win-x64.zip'
          Compress-Archive -Path artifacts/tui/*.exe, artifacts/tui/*.dll -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  sudoku-tui-win-x64.zip" | Set-Content -NoNewline artifacts/release/sudoku-tui-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: artifacts/release/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $flags

  nuget:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nuget
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Get short-lived nuget.org API key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        run: >
          dotnet nuget push "nuget/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json --skip-duplicate
